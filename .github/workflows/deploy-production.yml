name: Deploy to Production

on:
  push:
    branches: [production]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false  # never interrupt a deploy mid-flight

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Backend — trigger Render deploy hook, then health-check
  # ──────────────────────────────────────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend → Render
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Trigger Render deploy hook
        run: |
          curl -fsSL --retry 3 \
            "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

      - name: Wait for Render to boot
        run: sleep 90

      - name: Health check
        run: |
          for i in $(seq 1 20); do
            STATUS=$(curl -sf "${{ secrets.BACKEND_URL }}/api/health/" \
              | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('status',''))" 2>/dev/null || echo "error")
            if [[ "$STATUS" == "ok" ]]; then
              echo "Health check passed (attempt $i)"
              exit 0
            fi
            echo "Attempt $i: status=$STATUS — retrying in 15 s…"
            sleep 15
          done
          echo "Health check timed out after 5 minutes"
          exit 1

  # ──────────────────────────────────────────────────────────────────────────
  # Frontend — build and deploy to Vercel production
  # ──────────────────────────────────────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend → Vercel
    runs-on: ubuntu-latest
    environment: production

    defaults:
      run:
        working-directory: src

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_SITE_URL: ${{ secrets.VITE_SITE_URL }}
          VITE_GITHUB_URL: ${{ secrets.VITE_GITHUB_URL }}
          VITE_TWITTER_HANDLE: ${{ secrets.VITE_TWITTER_HANDLE }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: src
          vercel-args: "--prod"
