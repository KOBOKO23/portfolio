name: Deploy to Production

on:
  push:
    branches: [production]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false  # never interrupt a deploy mid-flight

permissions:
  id-token: write   # required for AWS OIDC — no long-lived AWS keys are stored in this repo
  contents: read

env:
  AWS_REGION: eu-west-1
  ECR_REPOSITORY: koboko-backend
  HOST_NAME_TAG: koboko-portfolio-host  # EC2 host from infra/aws/provision.sh

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Backend — build image, push to ECR, then koboko-deploy on the EC2 host
  # (pull, migrate, restart) through SSM Run Command
  # ──────────────────────────────────────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend → EC2 host
    runs-on: ubuntu-latest
    environment: production
    outputs:
      backend_url: ${{ secrets.BACKEND_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: build
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}"
          docker build --platform linux/arm64 -t "$IMAGE" -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" backend
          docker push "$IMAGE"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Pull, migrate and restart on the host (SSM)
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=$HOST_NAME_TAG" Name=instance-state-name,Values=running \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)
          CMD_ID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name koboko-portfolio-deploy \
            --comment "deploy ${{ github.sha }}" \
            --query Command.CommandId --output text)
          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" || true
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query '[Status,StandardOutputContent,StandardErrorContent]' --output text
          STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query Status --output text)
          [[ "$STATUS" == "Success" ]]

      - name: Health check
        run: |
          for i in $(seq 1 20); do
            STATUS=$(curl -sf "${{ secrets.BACKEND_URL }}/api/health/" \
              | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('data',{}).get('status',''))" 2>/dev/null || echo "error")
            if [[ "$STATUS" == "ok" ]]; then
              echo "Health check passed (attempt $i)"
              exit 0
            fi
            echo "Attempt $i: status=$STATUS — retrying in 15 s…"
            sleep 15
          done
          echo "Health check timed out after 5 minutes"
          exit 1

  # ──────────────────────────────────────────────────────────────────────────
  # Frontend — build and deploy to Vercel production
  # ──────────────────────────────────────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend → Vercel
    runs-on: ubuntu-latest
    environment: production

    defaults:
      run:
        working-directory: src

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_SITE_URL: ${{ secrets.VITE_SITE_URL }}
          VITE_GITHUB_URL: ${{ secrets.VITE_GITHUB_URL }}
          VITE_TWITTER_HANDLE: ${{ secrets.VITE_TWITTER_HANDLE }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}

      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
