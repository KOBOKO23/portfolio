backend:
  - changed-files:
    - any-glob-to-any-file: "backend/**"

frontend:
  - changed-files:
    - any-glob-to-any-file: "src/**"

ci:
  - changed-files:
    - any-glob-to-any-file: ".github/**"

docs:
  - changed-files:
    - any-glob-to-any-file:
      - "*.md"
      - "docs/**"

scripts:
  - changed-files:
    - any-glob-to-any-file: "scripts/**"

dependencies:
  - changed-files:
    - any-glob-to-any-file:
      - "backend/requirements*.txt"
      - "src/package.json"
      - "src/package-lock.json"
